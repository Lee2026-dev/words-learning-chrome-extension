<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body class="lingua-body">
    <div class="popup-container">
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">📘</span>
                <span class="logo-text">LinguaLearn</span>
            </div>
            <div class="nav-actions">
                <!-- Optional settings icon could go here -->
            </div>
        </nav>

        <div class="content-wrapper">
            <div class="stats-card">
                <div class="stat-item">
                    <span class="stat-label">Words Collected</span>
                    <span class="stat-value" id="word-count">0</span>
                </div>
                <div class="stat-icon-bg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
            </div>

            <div class="settings-group">
                <!-- Target Language -->
                <div class="setting-card">
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="2" y1="12" x2="22" y2="12"></line>
                                    <path
                                        d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                    </path>
                                </svg>
                            </div>
                            <div class="setting-text">
                                <span class="setting-label">Target Language</span>
                                <span class="setting-desc">Language to translate into</span>
                            </div>
                        </div>
                        <select id="target-lang" class="lingua-select">
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="zh">Chinese</option>
                            <option value="ja">Japanese</option>
                            <option value="it">Italian</option>
                            <option value="pt">Portuguese</option>
                            <option value="ru">Russian</option>
                        </select>
                    </div>
                </div>

                <!-- Highlighter -->
                <div class="setting-card">
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M12 20h9"></path>
                                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                                </svg>
                            </div>
                            <div class="setting-text">
                                <span class="setting-label">Highlighter</span>
                                <span class="setting-desc">Show saved words</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="highlight-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <!-- Immersion Mode -->
                <div class="setting-card">
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                                    </path>
                                </svg>
                            </div>
                            <div class="setting-text">
                                <span class="setting-label">Immersion</span>
                                <span class="setting-desc">Auto-translate content</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="immersion-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <!-- YouTube Subtitles -->
                <div class="setting-card">
                    <div class="setting-row">
                        <div class="setting-info">
                            <div class="setting-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z">
                                    </path>
                                    <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                                </svg>
                            </div>
                            <div class="setting-text">
                                <span class="setting-label">YouTube Subs</span>
                                <span class="setting-desc">Dual subtitles</span>
                            </div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="youtube-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="actions-grid">
                <button id="open-wordbook" class="action-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    Word Book
                </button>
                <button id="translate-page" class="action-btn primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                    Translate Page
                </button>
            </div>
        </div>
    </div>
    </div>
    <script src="api.js"></script>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
