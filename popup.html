<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body class="lingua-body">
    <div class="popup-container">
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">📘</span>
                <span class="logo-text">LinguaLearn</span>
            </div>
            <div class="nav-actions">
                <!-- Optional settings icon could go here -->
            </div>
        </nav>

        <div class="content-wrapper">
            <!-- Main View -->
            <div id="main-view" class="view-container active">
                <div class="stats-card">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">已收藏</span>
                            <span class="stat-value" id="word-count">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已掌握</span>
                            <span class="stat-value" id="mastered-count">0</span>
                        </div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="mastery-progress"></div>
                    </div>
                    <div class="progress-info" id="mastery-info">0% 掌握度</div>
                    <div class="stat-icon-bg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                    </div>
                </div>

                <div class="settings-group">
                    <!-- Target Language -->
                    <div class="setting-card">
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="2" y1="12" x2="22" y2="12"></line>
                                        <path
                                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                                        </path>
                                    </svg>
                                </div>
                                <div class="setting-text">
                                    <span class="setting-label">目标语言</span>
                                    <span class="setting-desc">翻译的目标语言</span>
                                </div>
                            </div>
                            <select id="target-lang" class="lingua-select">
                                <option value="zh">中文</option>
                            </select>
                        </div>
                    </div>

                    <!-- Highlighter (Nav Item) -->
                    <div class="setting-card clickable" id="open-highlight-settings">
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M12 20h9"></path>
                                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                                    </svg>
                                </div>
                                <div class="setting-text">
                                    <span class="setting-label">高亮单词</span>
                                    <span class="setting-desc">样式、颜色</span>
                                </div>
                            </div>
                            <div class="setting-action">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="chevron-right">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Immersion Mode -->
                    <div class="setting-card">
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                                        </path>
                                    </svg>
                                </div>
                                <div class="setting-text">
                                    <span class="setting-label">沉浸式阅读</span>
                                    <span class="setting-desc">自动翻译页面内容</span>
                                </div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="immersion-toggle">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>

                    <!-- YouTube Subtitles -->
                    <div class="setting-card">
                        <div class="setting-row">
                            <div class="setting-info">
                                <div class="setting-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z">
                                        </path>
                                        <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                                    </svg>
                                </div>
                                <div class="setting-text">
                                    <span class="setting-label">YouTube 字幕</span>
                                    <span class="setting-desc">显示双语字幕</span>
                                </div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="youtube-toggle" checked>
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="actions-grid">
                    <button id="open-wordbook" class="action-btn primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                        打开生词本
                    </button>
                </div>
            </div>

            <!-- Highlight Settings View -->
            <div id="highlight-settings-view" class="view-container">
                <div class="header-row">
                    <button id="back-to-main" class="back-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <span class="view-title">高亮设置</span>
                </div>

                <!-- Settings Form -->
                <div class="setting-card">
                    <div id="highlight-settings-panel" class="highlight-sub-panel visible"
                        style="max-height: none; opacity: 1; margin: 0; padding: 0; border: none;">

                        <!-- Style List -->
                        <div class="style-list">
                            <!-- Highlight (Background) -->
                            <div class="style-option" data-style="background">
                                <div class="style-info">
                                    <span class="style-name">高亮</span>
                                    <span class="style-desc">生词以颜色高亮的形式突出显示</span>
                                </div>
                                <div class="radio-circle"></div>
                            </div>

                            <!-- Transparency (Mask) -->
                            <div class="style-option" data-style="mask">
                                <div class="style-info">
                                    <span class="style-name">透明度</span>
                                    <span class="style-desc">生词以透明度的形式显示，不干扰阅读</span>
                                </div>
                                <div class="radio-circle"></div>
                            </div>

                            <!-- Underline -->
                            <div class="style-option" data-style="underline">
                                <div class="style-info">
                                    <span class="style-name">下划线</span>
                                    <span class="style-desc">生词以带有颜色的下划线的形式显示</span>
                                </div>
                                <div class="radio-circle"></div>
                            </div>

                            <!-- Bold -->
                            <div class="style-option" data-style="bold">
                                <div class="style-info">
                                    <span class="style-name">粗体</span>
                                    <span class="style-desc">生词以粗体的形式显示</span>
                                </div>
                                <div class="radio-circle"></div>
                            </div>
                        </div>

                        <!-- Color Picker (Moved to bottom) -->
                        <div class="sub-section color-section">
                            <label class="sub-label">高亮颜色</label>
                            <div class="color-palette">
                                <div class="color-swatch active" style="background: #FCD34D;" data-color="#FCD34D"
                                    title="黄色"></div>
                                <div class="color-swatch" style="background: #4ADE80;" data-color="#4ADE80" title="绿色">
                                </div>
                                <div class="color-swatch" style="background: #F472B6;" data-color="#F472B6" title="粉色">
                                </div>
                                <div class="color-swatch" style="background: #60A5FA;" data-color="#60A5FA" title="蓝色">
                                </div>
                                <div class="color-swatch" style="background: #A78BFA;" data-color="#A78BFA" title="紫色">
                                </div>
                                <label class="color-picker-wrapper" title="自定义颜色">
                                    <input type="color" id="custom-color-picker" value="#FCD34D">
                                    <div class="color-picker-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="13.5" cy="6.5" r=".5"></circle>
                                            <circle cx="17.5" cy="10.5" r=".5"></circle>
                                            <circle cx="8.5" cy="7.5" r=".5"></circle>
                                            <circle cx="6.5" cy="12.5" r=".5"></circle>
                                            <path
                                                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z">
                                            </path>
                                        </svg>
                                    </div>
                                </label>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="api.js"></script>
    <script src="utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
