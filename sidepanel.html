<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaLearn Side Panel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body class="lingua-body">
    <div class="sidepanel-container">
        <!-- Main View -->
        <div id="main-view">
            <!-- Header -->
            <header class="sp-header">
                <div class="logo-section">
                    <div class="logo-icon-bg">
                        <span class="logo-icon">📘</span>
                    </div>
                    <span class="logo-text">LinguaLearn</span>
                </div>
                <button class="icon-btn" id="settings-btn" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                        </path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </header>

            <!-- Main Content -->
            <main class="sp-content">

                <!-- Dashboard Stats -->
                <section class="sp-section stats-section">
                    <div class="stats-card-premium">
                        <!-- <div class="stats-header">
                            <span class="stats-title">Today's Progress</span>
                            <span class="stats-badge">+12 words</span>
                        </div> -->
                        <div class="stats-row">
                            <div class="stat-box" id="stat-saved-btn">
                                <div class="stat-icon saved">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                                    </svg>
                                </div>
                                <div class="stat-text">
                                    <span class="stat-num">85</span>
                                    <span class="stat-label">Saved</span>
                                </div>
                            </div>
                            <div class="stat-divider"></div>
                            <div class="stat-box">
                                <div class="stat-icon mastered">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                                        <path d="M4 22h16"></path>
                                        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                                        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                                        <path d="M18 2h-4a4 4 0 0 0-4 4v8.97a2 2 0 0 0 2.75 1.86A6.5 6.5 0 0 0 18 8V2">
                                        </path>
                                    </svg>
                                </div>
                                <div class="stat-text">
                                    <span class="stat-num">24</span>
                                    <span class="stat-label">Mastered</span>
                                </div>
                            </div>
                        </div>
                        <div class="mastery-track">
                            <div class="mastery-bar" style="width: 28%"></div>
                        </div>
                    </div>
                </section>

                <!-- Quick Actions -->
                <section class="sp-section">
                    <h3 class="section-title">Features</h3>

                    <!-- Toggle Item: Immersion -->
                    <div class="feature-card">
                        <div class="feature-icon bg-blue">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                            </svg>
                        </div>
                        <div class="feature-info">
                            <span class="feature-name">Immersion</span>
                            <span class="feature-desc">Translate page content</span>
                        </div>
                        <label class="switch-sm">
                            <input type="checkbox" id="immersion-toggle">
                            <span class="slider-sm round"></span>
                        </label>
                    </div>

                    <!-- Toggle Item: YouTube -->
                    <div class="feature-card">
                        <div class="feature-icon bg-red">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z">
                                </path>
                                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
                            </svg>
                        </div>
                        <div class="feature-info">
                            <span class="feature-name">YouTube</span>
                            <span class="feature-desc">Bilingual subtitles</span>
                        </div>
                        <label class="switch-sm">
                            <input type="checkbox" id="youtube-toggle" checked>
                            <span class="slider-sm round"></span>
                        </label>
                    </div>

                    <!-- Toggle Item: Highlight -->
                    <div class="feature-card">
                        <div class="feature-icon bg-yellow">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                            </svg>
                        </div>
                        <div class="feature-info">
                            <span class="feature-name">Highlight</span>
                            <span class="feature-desc">Mark saved words</span>
                        </div>
                        <label class="switch-sm">
                            <input type="checkbox" id="highlight-toggle" checked>
                            <span class="slider-sm round"></span>
                        </label>
                    </div>
                </section>


            </main>
        </div>

        <!-- Settings View -->
        <div id="settings-view" class="view-hidden">
            <header class="sp-header">
                <button class="icon-btn" id="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5"></path>
                        <path d="M12 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <span class="view-title">Settings</span>
                <div style="width: 32px;"></div>
            </header>

            <main class="sp-content">
                <!-- Highlight Settings -->
                <section class="sp-section">
                    <h3 class="section-title">Highlight Style</h3>
                    <div class="settings-card">
                        <div class="setting-group">
                            <label class="setting-label">Style</label>
                            <div class="style-buttons">
                                <button class="style-btn active" data-style="underline">
                                    <span
                                        style="text-decoration: underline; text-decoration-thickness: 2px;">Underline</span>
                                </button>
                                <button class="style-btn" data-style="background">
                                    <span
                                        style="background: var(--sp-primary); color: white; padding: 2px 8px; border-radius: 4px;">Background</span>
                                </button>
                                <button class="style-btn" data-style="bold">
                                    <span style="font-weight: 700;">Bold</span>
                                </button>
                            </div>
                        </div>

                        <div class="setting-group">
                            <label class="setting-label">Color</label>
                            <div class="color-palette">
                                <div class="color-dot active" style="background:#FCD34D" data-color="#FCD34D"
                                    title="Sunshine"></div>
                                <div class="color-dot" style="background:#4ADE80" data-color="#4ADE80" title="Green">
                                </div>
                                <div class="color-dot" style="background:#F472B6" data-color="#F472B6" title="Pink">
                                </div>
                                <div class="color-dot" style="background:#60A5FA" data-color="#60A5FA" title="Blue">
                                </div>
                                <div class="color-dot" style="background:#A78BFA" data-color="#A78BFA" title="Purple">
                                </div>
                                <label class="color-picker-label">
                                    <input type="color" id="custom-color-picker" value="#FCD34D">
                                    <div class="color-picker-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="13.5" cy="6.5" r=".5"></circle>
                                            <circle cx="17.5" cy="10.5" r=".5"></circle>
                                            <circle cx="8.5" cy="7.5" r=".5"></circle>
                                            <circle cx="6.5" cy="12.5" r=".5"></circle>
                                            <path
                                                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z">
                                            </path>
                                        </svg>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div class="setting-group">
                            <label class="setting-label">Preview</label>
                            <div class="preview-box">
                                This is <span id="preview-highlight" class="preview-word">example</span> text.
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- Word List View (New) -->
        <div id="word-list-view" class="view-hidden">
            <header class="sp-header">
                <button class="icon-btn" id="word-list-back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5"></path>
                        <path d="M12 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <span class="view-title">Saved Words</span>
                <div style="width: 32px;"></div>
            </header>
            <div class="sp-search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="word-search" placeholder="Search words..." class="sp-search-input">
                </div>
            </div>
            <main class="sp-content" id="word-list-container">
                <!-- Words will be injected here -->
            </main>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>

</html>
