<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Word Book - LinguaLearn</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .lingua-body {
            background-color: var(--bg-color);
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #stats-summary {
            color: var(--text-muted);
            font-weight: 500;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-main);
        }

        /* List Containers */
        .list-view {
            display: none;
        }

        .list-view.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Sentence-specific Grid override if needed */
        #sentence-list.active {
            grid-template-columns: 1fr;
            /* Sentences better as full width cards */
        }

        /* Word Card */
        .word-card {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--secondary-color);
        }

        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .word-original {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        .word-translation {
            font-size: 18px;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 16px;
        }

        .word-meta {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Sentence Card Styles */
        .sentence-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .sentence-ctx {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .sentence-highlight {
            background-color: rgba(249, 115, 22, 0.2);
            /* Orange tint */
            color: var(--cta-color);
            font-weight: 700;
            padding: 0 4px;
            border-radius: 4px;
        }

        .sentence-source {
            font-size: 13px;
            color: var(--text-muted);
            text-align: right;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* UI Elements */
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background-color: #F1F5F9;
            color: var(--primary-color);
        }

        .icon-btn.delete:hover {
            background-color: #FEF2F2;
            color: var(--danger-color);
        }

        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            color: var(--text-muted);
            text-align: center;
            background: white;
            border-radius: var(--radius);
            border: 1px dashed var(--border-color);
        }

        .empty-icon {
            margin-bottom: 20px;
            color: #CBD5E1;
        }

        .flash-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .flash-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="lingua-body">

    <header>
        <h1>
            <span style="font-size: 32px;">📘</span>
            My Word Book
        </h1>
        <div id="stats-summary">
            Loading...
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tab="words">Words</button>
        <button class="tab-btn" data-tab="sentences">Sentences</button>
    </div>

    <!-- WORDS VIEW -->
    <div id="word-list" class="list-view active word-list">
        <!-- Words injected here -->
    </div>

    <!-- SENTENCES VIEW -->
    <div id="sentence-list" class="list-view">
        <!-- Sentences injected here -->
    </div>

    <!-- Flash Message Toast -->
    <div id="flash-toast" class="flash-message">Copied!</div>

    <script src="api.js"></script>
    <script src="wordbook.js"></script>
</body>

</html>
